name: traffic sources

# Answers "where are the views coming from?" for status.stupidhimbo.com.
# The GoatCounter API key lives only in the repo secret, so we query it from
# inside Actions rather than from a local machine.
#
# Run it with:
#   gh workflow run traffic-sources.yml --repo bygrimm/where-is-grimm
# Then read it:
#   gh run list --repo bygrimm/where-is-grimm --workflow=traffic-sources.yml --limit 1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - name: query goatcounter stats
        env:
          GC_KEY: ${{ secrets.GOATCOUNTER_API_KEY }}
        run: |
          set -u
          API="https://stupidhimbo.goatcounter.com/api/v0"
          get() {
            curl -s "$API$1" \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer $GC_KEY"
          }

          echo "===== TOTAL VIEWS ====="
          get "/stats/total" | jq -r '.total // .hits[0].count // .'

          echo
          echo "===== WHERE THEY COME FROM (referrers) ====="
          get "/stats/toprefs" | jq -r '
            (if .stats then .stats else . end)
            | if type == "array" then .[] else . end
            | "\(.count)\t\(.name // .ref // .ref_scheme // "?")"
          ' 2>/dev/null || get "/stats/toprefs"

          echo
          echo "===== VISITORS BY BROWSER / OS / SCREEN / COUNTRY ====="
          for PAGE in browsers systems sizes locations; do
            echo "--- $PAGE ---"
            get "/stats/$PAGE" | jq -r '
              (if .stats then .stats else . end)
              | if type == "array" then .[] else . end
              | "\(.count)\t\(.name // .id // "?")"
            ' 2>/dev/null || echo "(no data)"
          done

          echo
          echo "===== RAW toprefs (fallback if the above is empty) ====="
          get "/stats/toprefs"
