name: update-goatcounter-count

on:
  schedule:
    # Run weekly to refresh the seven-day view count; blog check-in remains daily.
    - cron: '0 13 * * 0'
  push:
    paths:
      - .github/workflows/update-count.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-count:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch GoatCounter weekly views
        env:
          GOATCOUNTER_API_KEY: ${{ secrets.GOATCOUNTER_API_KEY }}
        run: |
          echo "Weekly count automation paused: preserve the verified dashboard value of 42 until the API range is reconciled."
          exit 0

      - name: Commit if changed
        run: |
          git config user.name "bygrimm"
          git config user.email "goatcounter@stupidhimbo.com"
          git add count.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "update weekly count [skip ci]"
            git push
            echo "pushed"
          fi
