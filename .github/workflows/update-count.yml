name: update-goatcounter-count

on:
  schedule:
    # Run weekly to refresh the seven-day view count; blog check-in remains daily.
    - cron: '0 13 * * 0'
  push:
    paths:
      - .github/workflows/update-count.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-count:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch GoatCounter weekly views
        env:
          GOATCOUNTER_API_KEY: ${{ secrets.GOATCOUNTER_API_KEY }}
        run: |
          start=$(date -u -d '6 days ago' +%Y-%m-%dT00:00:00Z)
          end=$(date -u -d 'tomorrow' +%Y-%m-%dT00:00:00Z)
          curl -sfG \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${GOATCOUNTER_API_KEY}" \
            --data-urlencode "start=${start}" \
            --data-urlencode "end=${end}" \
            "https://stupidhimbo.goatcounter.com/api/v0/stats/total" \
            -o /tmp/gc-week.json || { echo "API fetch failed"; exit 1; }
          weekly=$(python3 -c "import json; print(json.load(open('/tmp/gc-week.json')).get('total',0))")
          python3 -c "import json; d=json.load(open('/tmp/gc-week.json')); print('API range:', d.get('start'), 'to', d.get('end')); print('days returned:', len(d.get('stats', [])), 'daily sum:', sum(x.get('daily', 0) for x in d.get('stats', [])))"
          python3 -c "import json,datetime; json.dump({'weekly': int('${weekly}'), 'updated': datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')}, open('count.json','w'))"
          echo "wrote weekly=${weekly} for ${start} through ${end} UTC"

      - name: Commit if changed
        run: |
          git config user.name "bygrimm"
          git config user.email "goatcounter@stupidhimbo.com"
          git add count.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "update weekly count [skip ci]"
            git push
            echo "pushed"
          fi
